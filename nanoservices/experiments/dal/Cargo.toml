[package]
name = "dal"
version.workspace = true
edition.workspace = true

[features]
json-file = []
sqlx-postgres = ["sqlx", "once_cell"]

[dependencies]
serde ={ version="1.0.197", features = ["derive"]}
serde_json = "1.0.114"
glue = {path = "../../../glue/"}

# for sqlx-postgres
sqlx = { version = "0.7.4", features = ["postgres", "runtime-tokio", "json"], optional = true }
once_cell = { version = "1.19.0", optional = true }
